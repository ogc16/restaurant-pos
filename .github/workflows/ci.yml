name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore RestaurantPOS.slnx

      - name: Build (Release)
        run: dotnet build RestaurantPOS.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test RestaurantPOS.slnx --configuration Release --no-build --verbosity normal